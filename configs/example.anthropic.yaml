protocol: anthropic
model: claude-sonnet-4-5
base_url: https://api.anthropic.com
api_key: ${MONKEYCODE_API_KEY}

options:
  max_tokens: 2048
  thinking:
    type: adaptive
    effort: medium

context:
  enabled: true
  context_window_tokens: 5000
  auto_safety_margin_tokens: 13000
  manual_safety_margin_tokens: 3000
  recent_tail_tokens: 10000
  recent_tail_min_messages: 5
  single_tool_result_tokens: 6000
  turn_tool_results_tokens: 12000
  archive_dir: ".monkeycode/context"

worktree:
  enabled: true
  root: ".monkeycode/worktrees"
  ttl_hours: 24
  copy_paths: []
  link_dirs: []
  include_ignored: []
  hooks_path: null
