[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monkeycode"
version = "0.1.0"
description = "Terminal AI coding assistant with agent loop tool use"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "prompt_toolkit>=3.0.52,<4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
monkeycode = "monkeycode.cli:main"

[tool.setuptools.packages.find]
include = ["monkeycode*"]

[tool.setuptools.package-data]
"monkeycode.skills.builtin" = ["*/SKILL.md"]
"monkeycode.subagent.builtin" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
